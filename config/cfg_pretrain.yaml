# ARC training config

defaults:
  - arch: trm
  - _self_

hydra:
  output_subdir: null

# Data path
data_paths: ['data/arc-aug-1000']
data_paths_test: []

evaluators:
  - name: arc@ARC

# Hyperparams - Training
global_batch_size: 2048

epochs: 100000
eval_interval: 10000
checkpoint_every_eval: True

lr: 1e-4
lr_min_ratio: 1.0
lr_warmup_steps: 2000

# Standard hyperparameter settings for LM, as used in Llama
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.1

# Hyperparams - Puzzle embeddings training
puzzle_emb_lr: 1e-2

seed: 0
min_eval_interval: 0 # when to start the eval

ema: False # use Exponential-Moving-Average
ema_rate: 0.999 # EMA-rate
freeze_weights: False # If True, freeze weights and only learn the embeddings

# Opt-in only.  Set enabled=true *and* performance_only=true for a short
# profiling run; traces deliberately live outside checkpoints/.
perf_profiler:
  enabled: false
  performance_only: false
  output_dir: performance_profiles
  wait: 1
  warmup: 1
  active: 3
  repeat: 1
  max_steps: 64
  record_shapes: false
  profile_memory: true
  with_stack: false
  export_chrome_trace: true
  # PERF-DEV-18: must not be true at the same time as export_chrome_trace —
  # torch permits one kineto save per capture and the second aborts the run.
  export_tensorboard_trace: false
  # Folded stacks for flame charts (analysis/flamegraph.py). Requires with_stack.
  # Declared here so a run can override it as perf_profiler.export_stacks=true
  # rather than needing Hydra's +append form.
  export_stacks: false

# Opt-in only.  Set enabled=true *and* performance_only=true for a bounded
# unprofiled timing run (M2); artifacts deliberately live outside checkpoints/.
# Mutually exclusive with perf_profiler.enabled — profiler perturbation
# invalidates M2 throughput.
perf_benchmark:
  enabled: false
  performance_only: false
  output_dir: performance_benchmarks
  warmup_steps: 50
  measured_steps: 200
  eval_event_step: 2000
  max_steps: 2000
  condition_id: ""
  repeat: 1
  bootstrap_resamples: 10000
  bootstrap_seed: 0

# PERF-001 candidate P1-A rollback switch (off = registered unique() path).
puzzle_emb_dense_update: false
